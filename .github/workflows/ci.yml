name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.90"
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install --yes wabt
      - name: Build Abla compiler
        run: |
          git clone --depth 1 https://github.com/AndreBaltazar8/ablac "$RUNNER_TEMP/ablac"
          make -C "$RUNNER_TEMP/ablac" ablac
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - run: make build ABLA_ROOT="$RUNNER_TEMP/ablac" ABLA_COMPILER="$RUNNER_TEMP/ablac/build/ablac"
