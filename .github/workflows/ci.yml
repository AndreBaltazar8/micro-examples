name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      ABLAC_COMMIT: 357c9591643feb89f68ba8cd0a3b0bcb23858a90
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: "1.90"
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: cachix/install-nix-action@b85815f71a6de0ddee80b8a80a98d43f4bcc66c7 # v31
      - run: sudo apt-get update && sudo apt-get install --yes wabt
      - name: Build Abla compiler
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/AndreBaltazar8/ablac "$RUNNER_TEMP/ablac"
          git -C "$RUNNER_TEMP/ablac" checkout "$ABLAC_COMMIT"
          nix-shell "$RUNNER_TEMP/ablac/shell.nix" --run "make -C '$RUNNER_TEMP/ablac'"
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - run: nix-shell "$RUNNER_TEMP/ablac/shell.nix" --run "make build ABLA_ROOT='$RUNNER_TEMP/ablac' ABLA_COMPILER='$RUNNER_TEMP/ablac/build/ablac'"
